<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4f46e5" />
      <stop offset="100%" stop-color="#3730a3" />
    </linearGradient>
    <linearGradient id="certGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#f8fafc" />
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981" />
      <stop offset="100%" stop-color="#059669" />
    </linearGradient>
    <filter id="drop" x="-10%" y="-10%" width="130%" height="130%" filterUnits="userSpaceOnUse">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- App Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)" />

  <!-- Certificate Sheet -->
  <g filter="url(#drop)">
    <rect x="13" y="11" width="38" height="42" rx="4" fill="url(#certGrad)" />
    <!-- Certificate lines -->
    <rect x="18" y="18" width="18" height="3" rx="1.5" fill="#4f46e5" />
    <rect x="18" y="24" width="28" height="2" rx="1" fill="#cbd5e1" />
    <rect x="18" y="29" width="24" height="2" rx="1" fill="#cbd5e1" />
    <rect x="18" y="34" width="20" height="2" rx="1" fill="#cbd5e1" />
  </g>

  <!-- Golden / Emerald Delivery Seal -->
  <circle cx="39" cy="41" r="9" fill="url(#accentGrad)" filter="url(#drop)" />
  <!-- Checkmark inside Seal -->
  <path d="M35.5 41L38 43.5L43 38.5" stroke="#ffffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" />

  <!-- Dispatcher Paper Plane Accent -->
  <path d="M46 11L33 22L38 23L46 11Z" fill="#fbbf24" opacity="0.9" />
</svg>
